[package]
name = "nixe-settings"
version = "0.1.1"
description = "A control panel for Omarchy"
license = "MIT"
repository = "https://github.com/design-nexus/nixe"
authors = ["Ken Smith"]
edition = "2024"
default-run = "nixe-settings"

[dependencies]
nixe-core = { path = "../../crates/nixe-core" }
nixe-ui = { path = "../../crates/nixe-ui" }
nixe-theme = { path = "../../crates/nixe-theme" }
anyhow = "1.0.104"
gtk = { version = "0.11", package = "gtk4", features = ["v4_18"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = "1.1.6"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
