id = "webcam"
name = "Webcams"
version = "1.1.0"
description = "A live preview, microphone level and mic options for USB webcams, with zoom, pan and tilt, focus, exposure and white balance; OBSBOT Tiny 3 cameras can be kept awake."
exec = "./settings-webcam"
needs = ["v4l2-ctl", "python3", "ffmpeg"]
needs_hint = "Needs <tt>v4l2-ctl</tt> and <tt>ffmpeg</tt>: <tt>sudo pacman -S v4l-utils ffmpeg</tt>."
files = ["~/.config/settings/webcam.toml"]
